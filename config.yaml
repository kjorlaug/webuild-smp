# WE BUILD SMP 2.0 / BDXL configuration. Values marked PLACEHOLDER must be decided.
smp_base_url: https://smp.webuild.example         # PLACEHOLDER: host of the static site; resources live under /bdxr-smp-2/
bdxl_zone: bdxl.webuild.example                   # PLACEHOLDER: BDXL-01 zone published to partners
bdxl_mode: explicit                               # BDXL-05: explicit | wildcard
dns_ttl: 3600                                     # BDXL-06
pilot_end_date: 2027-12-31                        # PLACEHOLDER: REG-05 upper bound for ExpirationDate
trust_anchor_file: trust/webuild-smp-ca.pem       # SIG-04: published at /trust/trust-anchor.pem
# On-disk path layouts. Keep both until smoke_test.py against the live host shows
# which one it serves, then drop the other (README, "The spike").
path_layouts: [decoded, encoded]
participant_schemes:                              # ID-03
  - urn:oasis:names:tc:ebcore:partyid-type:iso6523:0192
  - urn:oasis:names:tc:ebcore:partyid-type:iso6523:0088
  - urn:oasis:names:tc:ebcore:partyid-type:iso6523:0208
transport_profiles:                               # TP-01, spec section 8
  - bdxr-transport-ebms3-as4-v1p0
  - webuild-transport-wmp-v1
